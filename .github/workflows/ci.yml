name: LLM Build Log Summarization

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run tests and capture build log
        shell: bash
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee build.log

      - name: LLM Build Error Summarization
        if: failure()
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/summarize_log.py